name: Executable README Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  readme-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy google-generativeai anthropic openai

      - name: Run executable README (path + structure tags)
        run: python -m konomi.readme_exec --tag path

      - name: Run executable README (test tags)
        run: python -m konomi.readme_exec --tag test
        env:
          KONOMI_DEMO: "1"

      - name: Run executable README (UDT tags)
        run: python -m konomi.readme_exec --tag udt
        env:
          KONOMI_DEMO: "1"

      - name: Run executable README (validate tags)
        run: python -m konomi.readme_exec --tag validate
        env:
          KONOMI_DEMO: "1"

      - name: Run executable README (crosswalk tags)
        run: python -m konomi.readme_exec --tag crosswalk
        env:
          KONOMI_DEMO: "1"

      - name: Run executable README (state tags)
        run: python -m konomi.readme_exec --tag state
        env:
          KONOMI_DEMO: "1"

      - name: Regenerate Pages JSON
        run: python -m konomi.api.generate_pages

      - name: Sync docs/benchmark mirror
        run: bash scripts/sync_docs_benchmark.sh

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only docs/)" ]; then
            echo "::warning::docs/ is out of date — run 'python -m konomi.api.generate_pages && bash scripts/sync_docs_benchmark.sh' and commit"
          fi

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: readme-exec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy google-generativeai anthropic openai

      - name: Check API keys available
        id: check-keys
        run: |
          if [ -n "$GEMINI_KEY" ]; then echo "has_gemini=true" >> $GITHUB_OUTPUT; fi
          if [ -n "$ANTHROPIC_KEY" ]; then echo "has_anthropic=true" >> $GITHUB_OUTPUT; fi
          if [ -n "$OPENAI_KEY" ]; then echo "has_openai=true" >> $GITHUB_OUTPUT; fi
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run benchmark (Gemini, single category)
        if: steps.check-keys.outputs.has_gemini == 'true'
        run: python -m konomi.triad.run --provider gemini --model gemini-2.0-flash --triad --categories ANACHRONISM_DETECTION
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run benchmark (Claude Haiku, single category)
        if: steps.check-keys.outputs.has_anthropic == 'true' && steps.check-keys.outputs.has_gemini == 'true'
        run: python -m konomi.triad.run --provider anthropic --model claude-haiku-4-5-20251001 --triad --categories ANACHRONISM_DETECTION
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/*.json
          if-no-files-found: ignore
